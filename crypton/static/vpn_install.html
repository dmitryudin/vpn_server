<html>

<head>
    <title>Установка VPN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <h1>Нажмите кнопку для установки VPN</h1>

    <!-- Вариант 1: Прямая ссылка -->
    <a href="{% url 'download_vpn' %}?username={{ request.user.username }}"
        style="padding: 10px 20px; background: #007AFF; color: white; text-decoration: none; border-radius: 5px;">
        Установить VPN
    </a>

    <!-- Вариант 2: Автоматическая загрузка через JS -->
    <script>
        window.onload = function () {
            window.location.href = "{% url 'download_vpn' %}?username={{ request.user.username }}";
        };
    </script>
</body>

</html>
